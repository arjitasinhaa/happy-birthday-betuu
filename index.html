<style>
:root{--mar:#3a0001;--cream:#ebe5db;--blk:#111;--red:#c8102e;--pink:#ff7aa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16000a;overflow:hidden;font-family:'Unbounded','Arial Black',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;background:var(--mar);transform-origin:center;overflow:hidden}
.screen{position:absolute;inset:0;display:none;color:var(--cream)}.screen.on{display:block}
.abs{position:absolute}.c{left:0;right:0;text-align:center}
h1{margin:0;font-weight:900;font-size:58px;line-height:1.08;letter-spacing:-1px;text-transform:uppercase}
.hand{font-family:'Caveat','Comic Sans MS',cursive;font-weight:700;font-size:44px;line-height:1.1}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{0%{transform:scale(0) rotate(var(--r,0deg));opacity:0}100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
.hide{opacity:0!important;pointer-events:none;animation:none!important}.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(var(--r2,3deg))}}
.polka{background:radial-gradient(#111 24%,transparent 25%) 0 0/84px 84px,var(--cream)}
.polka::after{content:"";position:absolute;inset:0;background:radial-gradient(#111 24%,transparent 25%) 42px 42px/84px 84px}
.pola{position:absolute;width:270px;padding:14px 14px 56px;background:#faf7f0;box-shadow:6px 10px 0 rgba(0,0,0,.35);transform:rotate(var(--r))}
.ph{width:100%;aspect-ratio:1;background:repeating-linear-gradient(45deg,#e6d3d3 0 14px,#d9c0c0 14px 28px);display:grid;place-items:center;font:900 20px 'Unbounded',sans-serif;color:#8a6464;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.heartph{width:270px;height:250px;position:absolute;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.heartph div{width:100%;height:100%;background:#fff;clip-path:path('M135 240C20 160 10 80 52 48c34-26 66-8 83 22 17-30 49-48 83-22 42 32 32 112-83 192z');display:grid;place-items:center}
.heartph .ph{width:84%;height:84%;aspect-ratio:auto;clip-path:path('M113 202C16 134 8 66 44 40c29-22 56-6 69 19 13-25 40-41 69-19 36 26 28 94-69 162z');transform:translate(0,2px) scale(1)}
.btn{position:absolute;left:50%;width:380px;height:104px;margin-left:-190px;border:5px solid var(--blk);border-radius:56px;background:var(--cream);color:var(--blk);font:900 30px 'Unbounded',sans-serif;box-shadow:0 8px 0 rgba(0,0,0,.45);cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-4px) rotate(-1.5deg)}.btn:active,.btn.press{transform:scale(.9);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.yes{background:var(--pink)}.btn.half{width:300px;margin-left:0;font-size:26px}
.btn.go{animation:bounce .35s}@keyframes bounce{40%{transform:scale(1.18)}100%{transform:scale(1)}}
.wig{animation:wig .5s}@keyframes wig{20%{transform:translateX(-14px) rotate(-5deg)}40%{transform:translateX(14px) rotate(5deg)}60%{transform:translateX(-10px)}80%{transform:translateX(8px)}}
.cur::after{content:"|";animation:bl .7s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.gift{position:absolute;width:190px;text-align:center;cursor:pointer;background:none;border:0;color:var(--cream);transition:transform .15s}
.gift:hover{transform:scale(1.1) rotate(-4deg)}.gift:active{transform:scale(.88)}
.gift svg{width:170px;height:170px;display:block;margin:0 auto 8px}.gift i{font:italic 26px Georgia,serif}
.gift.seen::after{content:"✓";position:absolute;top:-6px;right:14px;background:#7ed957;color:#111;border-radius:50%;width:44px;height:44px;font:900 26px/44px Arial}
svg{overflow:visible}.flame{animation:fl .4s ease-in-out infinite alternate;transform-origin:bottom}@keyframes fl{to{transform:scale(1.15,.85)}}
.out .flame{display:none}
.petal{position:absolute;top:-60px;font-size:40px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(1400px) rotate(500deg)}}
.cf{position:absolute;width:16px;height:26px;top:-40px;animation:cfall 2.6s ease-in forwards;pointer-events:none;z-index:50}
@keyframes cfall{to{transform:translateY(1380px) rotate(720deg)}}
.note{position:absolute;background:#fbf6e9 repeating-linear-gradient(transparent 0 53px,#e7c6c6 53px 55px);color:#2a1010;box-shadow:8px 12px 0 rgba(0,0,0,.35);padding:40px 38px}
.sticker svg{width:100%;height:100%}.handle{font-size:0}
.cursorhint{position:absolute;width:70px;animation:tap 1.6s ease-in-out infinite;pointer-events:none}@keyframes tap{50%{transform:translate(-18px,-24px) scale(.88)}}
</style></head><body>

  no1:"NO?",no2:"WOW.",no3:"UNBELIEVABLE.",no4:"I'm giving you one more chance.",no1b:"AGAIN?!",no2b:"OKAY RUDE.",no3b:"I'M TELLING MUM.",
  tryAgain:"TRY AGAIN",fine:"FINE, CONTINUE",
  choose:"CHOOSE YOUR SURPRISE 👀",chooseSub:"choose wisely...",chooseTip:"(you can open all 3, greedy)",finalOne:"🎁 THE BIG ONE",
  cake:"CAKE",flower:"FLOWER",message:"MESSAGE",
  cakeT:"CAKE BECAUSE OBVIOUSLY.",cakeHint:"tap the cake to blow the candles!",cakeWish:"WISH MADE ✨ (tell nobody)",
  flowerT:"A FLOWER FOR YOU 🌸",flowerNote:"fresh. smells like victory.",
  back:"BACK",next:"NEXT SURPRISE",
  final:"HAPPY BIRTHDAY, {NAME}!!! 🎂",finalA:"9 years hoye gelo duttu",finalB:"NOW GO EAT CAKE.",again:"PLAY AGAIN ↺"}};
/* =================================== */
const $=id=>document.getElementById(id),T=CONFIG.text,F=s=>s.replace(/{NAME}/g,CONFIG.name).replace(/{AGE}/g,CONFIG.age).replace(/{SISTER}/g,CONFIG.sister);
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=F(T[e.dataset.t]));
document.querySelectorAll('[data-ph]').forEach(e=>{const n=+e.dataset.ph,p=CONFIG.photos[n-1];e.innerHTML=p?`<img src="${p}" alt="">`:`PHOTO_0${n}`});
$('msg').textContent=F(CONFIG.message);
const stage=$('stage');function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/720,innerHeight/1280)})`}fit();addEventListener('resize',fit);
let tok=0,noCount=0;const seen=new Set(),order=['s6a','s6b','s6c'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(el,txt,sp=55,t=tok){el.textContent='';el.classList.add('cur');for(const ch of txt){if(t!==tok)return;el.textContent+=ch;await sleep(sp)}el.classList.remove('cur')}
function reveal(id,delay=0){const e=$(id);setTimeout(()=>{e.classList.remove('hide');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')},delay)}
function confetti(n=60){const c=['#ff7aa8','#c8102e','#ffd24a','#ebe5db','#7ed957','#4aa8ff'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*720}px;background:${c[i%6]};animation-delay:${Math.random()*.6}s;animation-duration:${2+Math.random()*1.5}s`;stage.appendChild(d);setTimeout(()=>d.remove(),4500)}}
function go(id){tok++;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));const s=$(id);s.classList.add('on');s.querySelectorAll('.pop').forEach(e=>{e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')});(enter[id]||(()=>{}))()}
function nextSurprise(){const n=order.find(x=>!seen.has(x));go(n||'s07')}
const enter={
 async s01(){const t=tok;$('s01btn').classList.add('hide');$('s01hint').classList.add('hide');await type(document.querySelector('[data-type=mail]'),T.mail,70,t);if(t!==tok)return;reveal('s01hint');await sleep(900);reveal('s01btn')},
 async s02(){const t=tok;['s02a','s02b','s02btn'].forEach(i=>$(i).classList.add('hide'));await sleep(1200);if(t!==tok)return;$('s02a').textContent=T.wait;reveal('s02a');await sleep(1300);if(t!==tok)return;$('s02a').textContent=T.wait+' '+T.who;await sleep(1500);if(t!==tok)return;$('s02a').classList.add('hide');$('s02b').textContent=T.bday;reveal('s02b');confetti();await sleep(1200);reveal('s02btn')},
 async s03(){const t=tok;['q2','yes','no'].forEach(i=>$(i).classList.add('hide'));await type(document.querySelector('[data-type=q1]'),T.q1,50,t);if(t!==tok)return;reveal('q2');await sleep(700);reveal('yes');reveal('no',250)},
 async s04(){const t=tok,b=noCount>1,L=[b?T.no1b:T.no1,b?T.no2b:T.no2,b?T.no3b:T.no3];['n1','n2','n3','n4','n5a','n5b'].forEach(i=>$(i).classList.add('hide'));
  $('n1').textContent=L[0];$('n2').textContent=L[1];$('n3').textContent=L[2];$('n4').textContent=T.no4;
  for(const [i,d] of [['n1',300],['n2',700],['n3',700],['n4',900],['n5a',600],['n5b',150]]){await sleep(d);if(t!==tok)return;reveal(i)}},
 s05(){document.querySelectorAll('.gift').forEach(g=>g.classList.toggle('seen',seen.has(g.dataset.go)));$('s05final').classList.toggle('hide',seen.size<3)},
 s6a(){seen.add('s6a');$('s6a').classList.remove('out');$('cakeHint').textContent=T.cakeHint},
 s6b(){seen.add('s6b');const p=$('petals');p.innerHTML='';for(let i=0;i<10;i++){const d=document.createElement('div');d.className='petal';d.textContent=['🌸','🌷','✨'][i%3];d.style.cssText=`left:${i*72}px;animation-duration:${5+i%4}s;animation-delay:${-i*.7}s`;p.appendChild(d)}},
 s6c(){seen.add('s6c')},
 async s07(){const t=tok;['f1','f2','f3','f4','f5','fT','fA','fB','fRe'].forEach(i=>$(i).classList.add('hide'));
  for(const i of ['f1','f2','f3','f4','f5']){await sleep(550);if(t!==tok)return;reveal(i)}
  await sleep(500);reveal('fT');confetti(90);await type($('fT'),F(T.final),60,t);if(t!==tok)return;await sleep(500);$('fA').textContent=T.finalA;reveal('fA');await sleep(1200);if(t!==tok)return;$('fB').textContent=T.finalB;reveal('fB');await sleep(900);reveal('fRe');seen.clear();noCount=0}};
document.querySelectorAll('button,#env,#cake').forEach(b=>b.addEventListener('click',()=>{
 if(b.id==='env'){go('s02');return}
 if(b.id==='cake'){$('s6a').classList.add('out');$('cakeHint').textContent=T.cakeWish;confetti(50);return}
 b.classList.add('press');setTimeout(()=>{b.classList.remove('press');b.classList.add('go');setTimeout(()=>b.classList.remove('go'),350);
  if(b.dataset.go)go(b.dataset.go);else if(b.dataset.act==='next')nextSurprise();else if(b.dataset.act==='no'){noCount++;go('s04')}},130)}));
$('no').addEventListener('pointerenter',e=>{const b=e.currentTarget;b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig')});  // wiggles, but never runs away
$('yes').addEventListener('click',()=>confetti(40));
go('s01');
</script></body></html>
